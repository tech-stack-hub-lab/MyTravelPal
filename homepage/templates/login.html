{% extends 'base.html' %}

{% block content %}
<section class="page-section">
  <div class="container" style="max-width: 500px; margin: 3rem auto;">
    <h1>Login</h1>
    <p>Enter your credentials to access your Travel Pal dashboard.</p>

    {% if form.errors %}
      <div class="alert alert-danger" role="alert">
        {{ form.non_field_errors }}
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>

    <p class="mt-3">
      Need an account?
      <a href="{% url 'homepage:register' %}">Register here</a>
    </p>
  </div>
</section>
{% endblock %}
