{% extends 'sidebar.html' %}

{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Step 1: Basic Trip Details</h3>
        <span class="badge bg-primary rounded-pill">1 / 4</span>
      </div>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn btn-primary">Next: Upload Booking Files</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
